name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shell syntax
        run: |
          set -eu
          for f in bin/nch install.sh lib/*.sh hooks/scripts/*.sh tests/*.sh; do
            sh -n "$f"
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh -S warning bin/nch install.sh lib/*.sh hooks/scripts/*.sh

      - name: suite
        run: sh tests/run.sh

  attribution:
    name: no agent attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: scan this branch
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          ./bin/nch scan --range "$base..HEAD"
